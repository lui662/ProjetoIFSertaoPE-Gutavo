<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Backend - Banco Digital</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .section {
            margin-bottom: 30px;
        }

        .section-title {
            color: #667eea;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            min-width: 120px;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f093fb;
            color: white;
        }

        .btn-secondary:hover {
            background: #e077e0;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(240, 147, 251, 0.4);
        }

        .btn-success {
            background: #4CAF50;
            color: white;
        }

        .btn-success:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        .response-box {
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #333;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .response-box.success {
            border-color: #4CAF50;
            background: #f1f8f4;
            color: #2e7d32;
        }

        .response-box.error {
            border-color: #f44336;
            background: #fff3cd;
            color: #d32f2f;
        }

        .response-box.loading {
            color: #667eea;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            flex: 1;
            min-width: 120px;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="password"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .status.online {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.offline {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }

        .status.online .status-dot {
            background: #28a745;
        }

        .status.offline .status-dot {
            background: #dc3545;
        }

        .form-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .form-row > * {
            flex: 1;
            min-width: 150px;
        }

        h2 {
            color: #667eea;
            font-size: 18px;
            margin: 20px 0 10px 0;
        }

        ul {
            margin-left: 20px;
            color: #666;
            line-height: 1.6;
        }

        li {
            margin-bottom: 8px;
        }

        code {
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏦 Teste de Backend</h1>
        <p class="subtitle">Banco Digital - Sistema de Clientes</p>

        <div class="status" id="status">
            <span class="status-dot"></span>
            <span>Verificando conexão...</span>
        </div>

        <!-- Seção de Testes de Conectividade -->
        <div class="section">
            <div class="section-title">📡 Conectividade</div>
            <div class="button-group">
                <button class="btn-primary" onclick="testConnection()">Testar Conexão</button>
                <button class="btn-primary" onclick="testHealth()">Health Check</button>
            </div>
            <div class="response-box" id="connectionResponse"></div>
        </div>

        <!-- Seção de Endpoints -->
        <div class="section">
            <div class="section-title">🔌 Endpoints</div>
            <div class="button-group">
                <button class="btn-secondary" onclick="listarClientes()">GET /clientes</button>
                <button class="btn-success" onclick="testarH2()">H2 Console</button>
            </div>
            <div class="response-box" id="endpointResponse"></div>
        </div>

        <!-- Seção de Informações -->
        <div class="section">
            <div class="section-title">ℹ️ Informações da API</div>
            <ul>
                <li><strong>Base URL:</strong> <code>http://localhost:8080</code></li>
                <li><strong>GET /clientes:</strong> Lista clientes</li>
                <li><strong>H2 Console:</strong> <code>http://localhost:8080/h2-console</code></li>
            </ul>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080';
        const responseBox = document.getElementById('endpointResponse');
        const connectionResponse = document.getElementById('connectionResponse');
        const statusEl = document.getElementById('status');

        // Verificar status ao carregar
        window.addEventListener('load', () => {
            checkServerStatus();
        });

        function updateStatus(online) {
            if (online) {
                statusEl.className = 'status online';
                statusEl.innerHTML = '<span class="status-dot"></span><span>✓ Servidor online</span>';
            } else {
                statusEl.className = 'status offline';
                statusEl.innerHTML = '<span class="status-dot"></span><span>✗ Servidor offline</span>';
            }
        }

        function checkServerStatus() {
            fetch(API_URL + '/', { method: 'HEAD' })
                .then(() => updateStatus(true))
                .catch(() => updateStatus(false));
        }

        function log(element, message, isError = false) {
            const timestamp = new Date().toLocaleTimeString();
            const prefix = isError ? '❌ ERRO' : '✓ OK';
            element.textContent += `[${timestamp}] ${prefix}\n${message}\n\n`;
            element.scrollTop = element.scrollHeight;
        }

        function clearLog(element) {
            element.textContent = '';
        }

        function testConnection() {
            clearLog(connectionResponse);
            connectionResponse.classList.add('loading');
            connectionResponse.textContent = '⏳ Testando conexão...';

            fetch(API_URL + '/')
                .then(response => {
                    connectionResponse.classList.remove('loading');
                    connectionResponse.classList.add('success');
                    log(connectionResponse, `Conexão bem-sucedida!\nStatus: ${response.status} ${response.statusText}`, false);
                    updateStatus(true);
                })
                .catch(error => {
                    connectionResponse.classList.remove('loading');
                    connectionResponse.classList.add('error');
                    log(connectionResponse, `Erro ao conectar:\n${error.message}`, true);
                    updateStatus(false);
                });
        }

        function testHealth() {
            clearLog(connectionResponse);
            connectionResponse.classList.add('loading');
            connectionResponse.textContent = '⏳ Executando health check...';

            fetch(API_URL + '/actuator/health', { method: 'GET' })
                .then(response => response.json())
                .then(data => {
                    connectionResponse.classList.remove('loading');
                    connectionResponse.classList.add('success');
                    log(connectionResponse, `Health Check:\n${JSON.stringify(data, null, 2)}`, false);
                })
                .catch(error => {
                    connectionResponse.classList.remove('loading');
                    connectionResponse.classList.add('error');
                    log(connectionResponse, `Health check não disponível (esperado)\n${error.message}`, false);
                });
        }

        function listarClientes() {
            clearLog(responseBox);
            responseBox.classList.remove('error');
            responseBox.classList.remove('success');
            responseBox.classList.add('loading');
            responseBox.textContent = '⏳ Carregando clientes...';

            fetch(API_URL + '/clientes', {
                method: 'GET',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                }
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    return response.text().then(text => {
                        responseBox.classList.remove('loading');
                        responseBox.classList.add('success');
                        const parsedJson = text ? JSON.stringify(JSON.parse(text), null, 2) : 'Resposta vazia';
                        log(responseBox, `GET /clientes\nStatus: ${response.status}\n\nResposta:\n${parsedJson}`, false);
                    });
                })
                .catch(error => {
                    responseBox.classList.remove('loading');
                    responseBox.classList.add('error');
                    log(responseBox, `GET /clientes\nErro: ${error.message}`, true);
                });
        }

        function testarH2() {
            alert('H2 Console disponível em:\nhttp://localhost:8080/h2-console\n\nCredenciais:\nUsuário: SA\nSenha: (vazio)');
            window.open(API_URL + '/h2-console', '_blank');
        }

        // Auto-refresh status periodicamente
        setInterval(checkServerStatus, 5000);
    </script>
</body>
</html>
